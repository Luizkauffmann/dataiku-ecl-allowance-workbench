name: Build V3 configurable engine assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'v3/_build_assets/**'
      - '.github/workflows/build-v3-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generator dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Materialize copy-paste V3 source files
        run: |
          mkdir -p v3/webapp
          base64 --decode v3/_build_assets/backend.py.gz.b64 | gunzip > v3/webapp/backend.py
          base64 --decode v3/_build_assets/app.js.gz.b64 | gunzip > v3/webapp/app.js
          base64 --decode v3/_build_assets/style.css.gz.b64 | gunzip > v3/webapp/style.css
          base64 --decode v3/_build_assets/body.html.gz.b64 | gunzip > v3/webapp/body.html
          base64 --decode v3/_build_assets/generate_v3_csvs.py.gz.b64 | gunzip > v3/generate_v3_csvs.py

      - name: Generate V3 synthetic configuration CSVs
        run: python v3/generate_v3_csvs.py

      - name: Validate generated files
        run: |
          python -m py_compile v3/webapp/backend.py
          test -s v3/webapp/body.html
          test -s v3/webapp/style.css
          test -s v3/webapp/app.js
          test -s v3/datasets/ecl_method_config.csv
          test -s v3/datasets/ecl_math_config.csv
          test -s v3/datasets/transition_matrices.csv
          test -s v3/datasets/lifetime_pd_curves.csv
          test -s v3/datasets/prepayment_curves.csv
          test -s v3/datasets/fixed_parameter_values.csv

      - name: Commit generated V3 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/generate_v3_csvs.py v3/webapp v3/datasets
          if ! git diff --cached --quiet; then
            git commit -m "Build V3 configurable ECL engine assets"
            git push
          else
            echo "No generated asset changes to commit."
          fi
